name: Quality checks

on:
  pull_request:
  push:
    branches: [main, 'fix/**']

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: node --check script.js
      - run: npm run build
      - run: npm run lint
      - run: npx firebase emulators:exec --only firestore "npm test"
